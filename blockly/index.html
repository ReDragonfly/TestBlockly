<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Blockly 自动化测试编辑器</title>
    <style>
        html, body { height: 100%; margin: 0; padding: 0;
                     font-family: "Microsoft YaHei", Arial, sans-serif; }
        #toolbar {
            height: 50px; display: flex; align-items: center;
            padding: 0 16px; background: #f5f5f5; box-sizing: border-box;
            border-bottom: 1px solid #ddd; gap: 12px;
        }
        #toolbar button {
            padding: 6px 16px; border: 1px solid #ccc;
            border-radius: 4px; cursor: pointer; background: #fff;
        }
        #toolbar button:hover { background: #e8e8e8; }
        #btnStop { color: #c0392b; border-color: #e0a0a0; }
        #status { margin-left: auto; color: #666; font-size: 13px; }

        #main { display: flex; height: calc(100% - 50px); }
        #blocklyDiv { flex: 1 1 auto; height: 100%; }

        #sidePanel {
            width: 430px; flex: 0 0 430px; border-left: 1px solid #ddd;
            background: #fafafa; box-sizing: border-box;
            display: flex; flex-direction: column;
        }
        .panel-title {
            padding: 6px 10px; font-size: 13px; font-weight: bold;
            background: #eee; border-bottom: 1px solid #ddd;
        }
        #log {
            height: 40%; overflow-y: auto; padding: 6px 10px;
            font-family: Consolas, monospace; font-size: 12px;
            white-space: pre-wrap; word-break: break-all;
            background: #fff; border-bottom: 1px solid #ddd;
        }
        #resultWrap { flex: 1 1 auto; overflow-y: auto; }
        #resultTable { width: 100%; border-collapse: collapse; font-size: 12px; }
        #resultTable th, #resultTable td {
            border: 1px solid #ddd; padding: 4px 6px; text-align: left;
        }
        #resultTable th { background: #f0f0f0; position: sticky; top: 0; }
        .pass-row { background: #eafaf1; }
        .fail-row { background: #fdecea; }
        td.pass { color: #1e8449; font-weight: bold; }
        td.fail { color: #c0392b; font-weight: bold; }
    </style>
</head>
<body>
    <div id="toolbar">
        <button id="btnRun">▶ 运行</button>
        <button id="btnStop">■ 停止</button>
        <button id="btnSave">保存工作区</button>
        <button id="btnLoad">加载工作区</button>
        <span id="status">就绪</span>
    </div>
    <div id="main">
        <div id="blocklyDiv"></div>
        <div id="sidePanel">
            <div class="panel-title">执行日志</div>
            <div id="log"></div>
            <div class="panel-title">测试结果</div>
            <div id="resultWrap">
                <table id="resultTable">
                    <thead>
                        <tr>
                            <th>链路</th><th>项目</th><th>条件</th>
                            <th>目标</th><th>实测</th><th>结果</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Blockly 核心（必须在生成器之前引入）
         说明：本页 URL 为 qrc:/blockly/index.html，qrc 中资源均已映射到 /blockly/ 下的扁平路径，
         故此处使用相对路径直接引用，不再重复 blockly/ 前缀。 -->
    <script src="blockly_compressed.js"></script>
    <!-- 文案表必须在 blocks_compressed.js 之前加载：
         标准积木定义中大量使用 %{BKY_XXX} 占位符，占位符在积木定义时按 Blockly.Msg 替换，
         Msg 为空则原样保留，界面上就会显示成 %{BKY_CONTROLS_IF_MSG_IF} 这类英文占位符。 -->
    <script src="msg.zh-hans.js"></script>
    <script src="blocks_compressed.js"></script>
    <script src="lua_compressed.js"></script>

    <!-- Qt WebChannel 提供的通信脚本 -->
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>

    <!-- 项目自定义脚本 -->
    <script src="custom-blocks.js"></script>
    <script src="custom-generators.js"></script>
    <script src="toolbox.js"></script>
    <script src="bridge.js"></script>
    <script src="blockly-config.js"></script>
</body>
</html>
